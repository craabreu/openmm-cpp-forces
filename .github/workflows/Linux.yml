name: Linux

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly tests run on Sundays at 4 AM UTC (12 AM EST):
    - cron: "0 4 * * 0"

jobs:
  unix:
    runs-on: ubuntu-24.04
    name: Linux (Python ${{ matrix.python-version }}, OpenMM ${{ matrix.openmm-version }}, SWIG ${{ matrix.swig-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            openmm-version: "8.6"
            swig-version: "4.5"
          - python-version: "3.12"
            openmm-version: "8.4"
            swig-version: "4.4"

    steps:
      - name: "Check out"
        uses: actions/checkout@v4

      - name: "Install dependencies with micromamba"
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/build.yml
          environment-name: build
          create-args: >-
            python=${{ matrix.python-version }}
            openmm=${{ matrix.openmm-version }}
            swig=${{ matrix.swig-version }}

      - name: "List conda packages"
        shell: bash -l {0}
        run: micromamba list

      - name: "Configure"
        shell: bash -l {0}
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: "Build"
        shell: bash -l {0}
        run: |
          cd build
          make -j3 install
          make -j3 PythonWrapper
          pip install --no-deps -e python/

      - name: "List plugins"
        shell: bash -l {0}
        run: |
          python -c "import openmm as mm; print('---Loaded---', *mm.pluginLoadedLibNames, '---Failed---', *mm.Platform.getPluginLoadFailures(), sep='\n')"

      - name: "Run C++ tests"
        shell: bash -l {0}
        run: |
          cd build
          ctest --output-on-failure

      - name: "Run Python tests"
        shell: bash -l {0}
        run: |
          cd build/python
          pytest

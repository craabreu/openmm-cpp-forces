name: Docs

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: write  # to push the gh-pages branch

jobs:
  unix:
    runs-on: ubuntu-latest
    name: Build and Deploy to GitHub Pages

    steps:
      - name: "Check out"
        uses: actions/checkout@v4

      - name: "Additional info about the build"
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: "Install Micromamba"
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/build-docs.yml
          environment-name: docs
          create-args: >-
            python=3.13
            openmm=8.6

      - name: "List conda packages"
        shell: bash -l {0}
        run: micromamba list

      - name: "Configure"
        shell: bash -l {0}
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: "Build package"
        shell: bash -l {0}
        run: |
          cd build
          make -j4 install
          make -j4 PythonWrapper
          pip install --no-deps -e python/

      - name: "Build docs"
        shell: bash -l {0}
        run: |
          sphinx-build ./docs ./html

      - name: "Deploy docs to GitHub Pages"
        if: github.event_name != 'pull_request'
        shell: bash -l {0}
        run: |
          git reset --hard HEAD
          set -x
          echo "::group::Push page to gh-pages branch"
          git config user.name "$(git show --format=%an -s)"
          git config user.email "$(git show --format=%ae -s)"
          git fetch origin
          git switch gh-pages
          rsync -va --delete-excluded html/ docs/
          touch docs/.nojekyll
          git add -f docs/*
          git add -f docs/.nojekyll
          git commit -m "Docs from $GITHUB_REF $GITHUB_SHA" || echo "Branch is up to date"
          git push -f origin gh-pages
          echo "::endgroup::"

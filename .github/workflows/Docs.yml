name: Docs

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  release:
    types: [published]
  # Rebuild the docs of an existing release tag (also updates latest)
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, such as v0.2.0"
        required: true

permissions:
  contents: write  # to push the gh-pages branch

jobs:
  unix:
    runs-on: ubuntu-latest
    name: Build and Deploy to GitHub Pages
    # Prereleases are not deployed
    if: github.event_name != 'release' || !github.event.release.prerelease
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: "Check out"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: "Additional info about the build"
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: "Install Micromamba"
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/build-docs.yml
          environment-name: docs
          create-args: >-
            python=3.13
            openmm=8.6

      - name: "List conda packages"
        shell: bash -l {0}
        run: micromamba list

      - name: "Configure"
        shell: bash -l {0}
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: "Build package"
        shell: bash -l {0}
        run: |
          cd build
          make -j4 install
          make -j4 PythonWrapper
          pip install --no-deps -e python/

      - name: "Build docs"
        shell: bash -l {0}
        run: |
          export CPF_VERSION=${RELEASE_TAG:-dev}
          sphinx-build ./docs ./html

      - name: "Deploy docs to GitHub Pages"
        if: github.event_name != 'pull_request'
        shell: bash -l {0}
        run: |
          set -e
          if [ -n "$RELEASE_TAG" ]; then
            subdirs=("$RELEASE_TAG" latest)
          else
            subdirs=(development)
          fi
          git reset --hard HEAD
          set -x
          echo "::group::Push page to gh-pages branch"
          git config user.name "$(git show --format=%an -s)"
          git config user.email "$(git show --format=%ae -s)"
          git fetch origin
          git switch gh-pages
          # Pages from before versioned docs lived directly in docs/; keep only version folders
          find docs -mindepth 1 -maxdepth 1 ! -name 'v*' ! -name latest ! -name development -exec rm -rf {} +
          for subdir in "${subdirs[@]}"; do
            rsync -a --delete html/ docs/$subdir/
          done
          # The root redirects to the latest release, or to development before the first release
          target=development
          [ -d docs/latest ] && target=latest
          printf '<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv="refresh" content="0; url=%s/" />\n</head>\n<body>\n    <p>Redirecting to the <a href="%s/">documentation</a>...</p>\n</body>\n</html>\n' $target $target > docs/index.html
          touch docs/.nojekyll
          git add -A -f docs
          git commit -m "Docs from $GITHUB_REF $GITHUB_SHA" || echo "Branch is up to date"
          git push origin gh-pages
          echo "::endgroup::"

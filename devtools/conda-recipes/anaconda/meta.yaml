{% set plugin_version = environ.get('PLUGIN_VERSION', 'v0.0.0').lstrip('v') %}

package:
  name: openmm-cpp-forces
  version: {{ plugin_version }}

source:
  git_url: ../../..

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
    - swig {{ swig }}
  host:
    - python
    - openmm {{ openmm }}
    - numpy
    - pip
    - setuptools
  run:
    - python
    - {{ pin_compatible('openmm', max_pin='x.x') }}
    - numpy

test:
  requires:
    - pytest
  imports:
    - openmmcppforces
  commands:
    - pytest -v --pyargs openmmcppforces.tests

about:
  home: https://github.com/craabreu/openmm-cpp-forces
  summary: Platform-agnostic OpenMM Forces
  license: MIT
  license_file: LICENSE.md
  doc_url: https://craabreu.github.io/openmm-cpp-forces
  dev_url: https://github.com/craabreu/openmm-cpp-forces

extra:
  recipe-maintainers:
    - craabreu
